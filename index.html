<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soyuz Microphone Customizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="bg-[#f4e9dc] min-h-screen w-full relative overflow-hidden">
      <div class="flex flex-col md:flex-row h-screen">
        <!-- Left Menu -->
        <div id="menu-container" class="w-full md:w-[495px] bg-[#eae0d4] flex flex-col justify-between px-[clamp(20px,5vw,45px)] py-[clamp(20px,5vh,60px)] overflow-y-auto overflow-x-hidden">
          <div class="flex flex-col gap-[clamp(25px,5vh,50px)]">
            <!-- Microphone Section -->
            <div class="flex flex-col gap-[clamp(10px,2vh,20px)]">
              <h2 class="font-['Inter:Bold',sans-serif] text-[clamp(18px,3vw,28px)] text-black tracking-[-0.56px]">
                Микрофон
              </h2>

              <div class="flex items-center gap-2">
                <button id="model-017" class="font-['Inter:Semi_Bold',sans-serif] text-lg px-4 py-2 rounded-md">017 Series</button>
                <button id="model-023" class="font-['Inter:Semi_Bold',sans-serif] text-lg px-4 py-2 rounded-md">023 Model</button>
              </div>
              <div class="flex flex-col">
                <!-- Spheres -->
                <div id="menu-item-spheres" class="bg-[#faf5ef] h-[84px] border-t-2 border-[rgba(0,0,0,0.1)] px-[clamp(10px,2vw,20px)] py-[15px] flex items-center gap-[clamp(10px,2vw,20px)] cursor-pointer hover:bg-[#f5f0ea] transition-colors">
                  <div class="size-[49px] rounded-full border-2 border-[rgba(0,0,0,0.2)] flex items-center justify-center overflow-hidden shrink-0">
                    <div id="spheres-color-preview" class="w-[85%] h-[85%] rounded-full" style="background-color: #FFEA00;"></div>
                  </div>
                  <div class="flex-1 flex flex-col gap-[4px] min-w-0">
                    <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(12px,2.5vw,24px)] text-black truncate">Полусферы</p>
                    <p id="spheres-subtitle" class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] truncate">Стиль 017</p>
                  </div>
                  <svg id="spheres-chevron" class="text-[#4a3113] opacity-60 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                  <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] shrink-0">+1500₽</p>
                </div>
                <div id="submenu-spheres" class="hidden bg-[#f5f0ea] border-t-2 border-[rgba(0,0,0,0.05)]">
                </div>
                <!-- Body -->
                <div id="menu-item-body" class="bg-[#faf5ef] h-[84px] border-t-2 border-[rgba(0,0,0,0.1)] px-[clamp(10px,2vw,20px)] py-[15px] flex items-center gap-[clamp(10px,2vw,20px)] cursor-pointer hover:bg-[#f5f0ea] transition-colors">
                  <div class="size-[49px] rounded-full border-2 border-[rgba(0,0,0,0.2)] flex items-center justify-center overflow-hidden shrink-0">
                    <div id="body-color-preview" class="w-[85%] h-[85%] rounded-full" style="background-color: #F68BE3;"></div>
                  </div>
                  <div class="flex-1 flex flex-col gap-[4px] min-w-0">
                    <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(12px,2.5vw,24px)] text-black truncate">Корпус</p>
                    <p id="body-subtitle" class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] truncate">Стиль 023</p>
                  </div>
                  <svg id="body-chevron" class="text-[#4a3113] opacity-60 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                  <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] shrink-0">+1500₽</p>
                </div>
                <div id="submenu-body" class="hidden bg-[#f5f0ea] border-t-2 border-[rgba(0,0,0,0.05)]">
                </div>
                <!-- Badge -->
                <div id="menu-item-badge" class="bg-[#faf5ef] h-[84px] border-t-2 border-[rgba(0,0,0,0.1)] px-[clamp(10px,2vw,20px)] py-[15px] flex items-center gap-[clamp(10px,2vw,20px)] cursor-pointer hover:bg-[#f5f0ea] transition-colors">
                  <div class="size-[49px] rounded-full border-2 border-[rgba(0,0,0,0.2)] flex items-center justify-center overflow-hidden shrink-0">
                    <div id="badge-icon-preview" class="w-[85%] h-[85%] rounded-full bg-[#e2d5c5] flex items-center justify-center">
                    </div>
                  </div>
                  <div class="flex-1 flex flex-col gap-[4px] min-w-0">
                    <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(12px,2.5vw,24px)] text-black truncate">Шильдик</p>
                    <p id="badge-subtitle" class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] truncate">Стиль 017</p>
                  </div>
                  <svg id="badge-chevron" class="text-[#4a3113] opacity-60 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                  <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] shrink-0">+1500₽</p>
                </div>
                <div id="submenu-badge" class="hidden bg-[#f5f0ea] border-t-2 border-[rgba(0,0,0,0.05)]">
                </div>
                <input id="badge-upload" type="file" accept="image/*" class="hidden">
              </div>
            </div>
            <!-- Suitcase Section -->
            <div class="flex flex-col gap-[clamp(10px,2vh,20px)]">
              <h2 class="font-['Inter:Bold',sans-serif] text-[clamp(18px,3vw,28px)] text-black tracking-[-0.56px]">
                Чемодан
              </h2>
              <div id="menu-item-case" class="bg-[#faf5ef] h-[84px] border-t-2 border-[rgba(0,0,0,0.1)] px-[clamp(10px,2vw,20px)] py-[15px] flex items-center gap-[clamp(10px,2vw,20px)] cursor-pointer hover:bg-[#f5f0ea] transition-colors">
                <div class="size-[49px] rounded-full border-2 border-[rgba(0,0,0,0.2)] flex items-center justify-center overflow-hidden shrink-0">
                  <div class="w-[85%] h-[85%] rounded-full bg-[#e2d5c5] flex items-center justify-center">
                  </div>
                </div>
                <div class="flex-1 flex flex-col gap-[4px] min-w-0">
                  <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(12px,2.5vw,24px)] text-black truncate">Логотип</p>
                  <p id="case-logo-subtitle" class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] truncate">Фирменный СОЮЗ</p>
                </div>
                <input id="case-logo-upload" type="file" accept="image/*" class="hidden">
              </div>
            </div>
            <!-- Shockmount Section -->
            <div class="flex flex-col gap-[clamp(10px,2vh,20px)]">
              <h2 class="font-['Inter:Bold',sans-serif] text-[clamp(18px,3vw,28px)] text-black tracking-[-0.56px]">
                Амортизатор
              </h2>
              <div id="menu-item-shockmount" class="bg-[#faf5ef] h-[84px] border-t-2 border-[rgba(0,0,0,0.1)] px-[clamp(10px,2vw,20px)] py-[15px] flex items-center gap-[clamp(10px,2vw,20px)] cursor-pointer hover:bg-[#f5f0ea] transition-colors">
                <div class="size-[49px] rounded-full border-2 border-[rgba(0,0,0,0.2)] flex items-center justify-center overflow-hidden shrink-0">
                  <div id="shockmount-color-preview" class="w-[85%] h-[85%] rounded-full" style="background-color: #e2dbd2;"></div>
                </div>
                <div class="flex-1 flex flex-col gap-[4px] min-w-0">
                  <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(12px,2.5vw,24px)] text-black truncate">Цвет</p>
                  <p id="shockmount-subtitle" class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] truncate">Кремовый</p>
                </div>
                <svg id="shockmount-chevron" class="text-[#4a3113] opacity-60 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                <p class="font-['Inter:Semi_Bold',sans-serif] text-[clamp(8px,1.5vw,16px)] text-[#4a3113] opacity-60 tracking-[-0.16px] shrink-0">+1500₽</p>
              </div>
              <div id="submenu-shockmount" class="hidden bg-[#f5f0ea] border-t-2 border-[rgba(0,0,0,0.05)]">
              </div>
            </div>
          </div>
        </div>
        <!-- Preview Area -->
        <div id="preview-container" class="flex-1 relative flex items-center justify-center overflow-hidden h-[60vh] md:h-auto">
          <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="relative w-full h-full max-w-[1425px] max-h-[1148px]" style="aspect-ratio: '1425/1148'">
              <div class="absolute inset-0 scale-[0.5] md:scale-75 lg:scale-90 xl:scale-100 origin-center">
                <div class="relative" style="width: 1425px; height: 1148px;">
                  <!-- Case -->
                  <div class="absolute h-[894.91px] left-[calc(50%+46.5px)] top-[calc(50%-20.545px)] -translate-x-1/2 -translate-y-1/2 w-[744px]">
                    <img src="./assets/case_background.png" alt="Case" class="w-full h-full object-cover">
                  </div>
                  <!-- Shockmount -->
                  <div class="absolute bottom-[106px] left-[215px] w-[384.679px] h-[459.838px]">
                    <div class="relative w-full h-full">
                      <div id="shockmount-color-layer" class="absolute h-[443.587px] left-[3.05px] top-0 w-[381.633px] opacity-0" style="mask-image: url('./assets/shockmount_mask.png'); mask-size: 381.632px 443.587px; mask-position: 0px 0px; -webkit-mask-image: url('./assets/shockmount_mask.png'); -webkit-mask-size: 381.632px 443.587px; -webkit-mask-position: 0px 0px;">
                        <img src="./assets/shockmount_color_base.png" alt="" class="w-full h-full object-cover">
                      </div>
                      <div id="shockmount-cream-layer" class="absolute h-[443.587px] left-[3.05px] top-0 w-[381.633px] opacity-100" style="mask-image: url('./assets/shockmount_mask.png'); mask-size: 381.632px 443.587px; mask-position: 0px 0px; -webkit-mask-image: url('./assets/shockmount_mask.png'); -webkit-mask-size: 381.632px 443.587px; -webkit-mask-position: 0px 0px;">
                        <img src="./assets/shockmount_cream.png" alt="" class="w-full h-full object-cover">
                      </div>
                      <div id="shockmount-color-overlay" class="absolute h-[454px] left-[-8px] top-[-5.16px] w-[397px] opacity-0" style="background-color: rgb(36, 88, 166); mask-image: url('./assets/shockmount_mask.png'); mask-size: 381.632px 443.587px; mask-position: 11.047px 5.162px; mix-blend-mode: multiply; -webkit-mask-image: url('./assets/shockmount_mask.png'); -webkit-mask-size: 381.632px 443.587px; -webkit-mask-position: 11.047px 5.162px;"></div>
                      <div class="absolute h-[429.368px] left-0 top-[30.47px] w-[358.272px]">
                        <img src="./assets/shockmount_details.png" alt="" class="w-full h-full object-cover">
                      </div>
                    </div>
                  </div>
                  <!-- Microphone -->
                  <div id="microphone-container" class="absolute bottom-[106px] right-[373px] w-[205px] h-[701.177px] overflow-clip">
                    <div class="absolute h-[701.177px] left-0 top-0 w-[205px]" style="mask-image: url('./assets/microphone_mask.png'); mask-size: 205px 701.177px; mask-position: 0px 0px; -webkit-mask-image: url('./assets/microphone_mask.png'); -webkit-mask-size: 205px 701.177px; -webkit-mask-position: 0px 0px;">
                      <div class="absolute h-[108.116px] left-0 top-[593.06px] w-[205px]">
                        <img id="bottom-sphere-img" src="./assets/spheres_bottom_preset2.png" alt="" class="w-full h-full object-cover">
                      </div>
                      <div id="bottom-sphere-color" class="absolute h-[120.051px] left-0 top-[593.94px] w-[205px] opacity-0" style="background-color: rgb(255, 234, 0); mix-blend-mode: multiply;"></div>
                    </div>
                    <div class="absolute h-[701.177px] left-0 top-0 w-[205px]" style="mask-image: url('./assets/microphone_mask.png'); mask-size: 205px 701.177px; mask-position: 0px 0px; -webkit-mask-image: url('./assets/microphone_mask.png'); -webkit-mask-size: 205px 701.177px; -webkit-mask-position: 0px 0px;">
                      <div class="absolute h-[264.675px] left-[19.13px] top-[329.26px] w-[166.562px]">
                        <img id="body-img" src="./assets/body_preset2.png" alt="" class="w-full h-full object-cover">
                      </div>
                      <div id="body-color" class="absolute h-[264.675px] left-[18.95px] top-[329.26px] w-[166.738px] opacity-0" style="background-color: rgb(246, 139, 227); mix-blend-mode: multiply;"></div>
                    </div>
                    <div class="absolute h-[701.177px] left-0 top-0 w-[205px]" style="mask-image: url('./assets/microphone_mask.png'); mask-size: 205px 701.177px; mask-position: 0px 0px; -webkit-mask-image: url('./assets/microphone_mask.png'); -webkit-mask-size: 205px 701.177px; -webkit-mask-position: 0px 0px;">
                      <div class="absolute h-[329.264px] left-0 top-0 w-[205px]">
                        <img id="top-sphere-img" src="./assets/spheres_top_preset2.png" alt="" class="w-full h-full object-cover">
                      </div>
                      <div id="top-sphere-color" class="absolute h-[329.264px] left-0 top-0 w-[205px] opacity-0" style="background-color: rgb(255, 234, 0); mix-blend-mode: multiply;"></div>
                    </div>
                    <div class="absolute h-[84.422px] left-[calc(50%+0.088px)] top-[calc(50%+73.891px)] -translate-x-1/2 -translate-y-1/2 w-[83.018px] z-10" style="mask-image: url('./assets/microphone_mask.png'); mask-size: 205px 701.177px; mask-position: -61.079px -382.269px; -webkit-mask-image: url('./assets/microphone_mask.png'); -webkit-mask-size: 205px 701.177px; -webkit-mask-position: -61.079px -382.269px;">
                      <img id="badge-img" src="./assets/badge_style017.png" alt="Badge" class="w-full h-full object-cover">
                    </div>
                    <div class="absolute h-[138.129px] left-[33px] top-[10.57px] w-[137.949px] z-10 opacity-100" style="mask-image: url('./assets/microphone_mask.png'); mask-size: 205px 701.177px; mask-position: -32.999px -10.574px; -webkit-mask-image: url('./assets/microphone_mask.png'); -webkit-mask-size: 205px 701.177px; -webkit-mask-position: -32.999px -10.574px;">
                      <img src="./assets/microphone_grill.png" alt="Grill" class="w-full h-full object-cover">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
        window.SOYUZ_CONFIG = {
            "asset_path": "./assets/",
            "models": [
                { "id": "017", "name": "017 Series", "badge": "badge_style017.png", "dimensions": { "width": "205px", "height": "701px" } },
                { "id": "023", "name": "023 Model", "badge": "badge_style023.png", "dimensions": { "width": "180px", "height": "650px" } }
            ],
            "ral_colors": [
                { "ral": "9005", "hex": "#0E0E10", "name": "Jet Black" },
                { "ral": "1013", "hex": "#EAE0D3", "name": "Oyster White" },
                { "ral": "6005", "hex": "#002E1B", "name": "Moss Green" },
                { "ral": "3003", "hex": "#8B0000", "name": "Ruby Red" },
                { "ral": "5011", "hex": "#1B2632", "name": "Steel Blue" },
                { "ral": "9006", "hex": "#A5A8A6", "name": "White Aluminium" }
            ]
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
